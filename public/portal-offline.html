<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#103B64" />
  <title>Evergreen Water — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf6fb;color:#103b64;font-family:Arial,sans-serif;padding:24px}.card{width:min(420px,100%);background:#fff;border:1px solid #d7e9f1;border-radius:28px;padding:32px;text-align:center;box-shadow:0 20px 55px rgba(16,59,100,.12)}.mark{width:76px;height:76px;margin:auto;display:grid;place-items:center;border-radius:24px;background:#103b64;color:#fff;font-weight:900;font-size:30px}.drop{color:#00a6c8}h1{font-size:22px;margin:20px 0 8px}p{color:#5b7184;font-size:14px;line-height:1.5;margin:0 0 20px}button{border:0;border-radius:14px;background:#00a6c8;color:#fff;font-weight:700;padding:12px 22px;font-size:14px}
  </style>
</head>
<body><main class="card"><div class="mark">E<span class="drop">W</span></div><h1>You're offline</h1><p>Connect to the internet to view your latest deliveries, bills, payments and bottle balance. Private account data is not stored in the offline cache.</p><button onclick="location.reload()">Try Again</button></main></body>
</html>
